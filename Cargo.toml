[package]
name = "wa-snap"
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "Schneller nativer WhatsApp-Desktop-Client in Rust (inoffiziell)"

[dependencies]
whatsapp-rust = { version = "0.7", default-features = false, features = ["tokio-runtime", "tokio-native", "tokio-transport", "ureq-client", "sqlite-storage"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
eframe = "0.31"
qrcode = { version = "0.14", default-features = false }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "4"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ksni = { version = "0.3", features = ["blocking"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4

[package.metadata.generate-rpm]
name = "wa-snap"
summary = "Schneller nativer WhatsApp-Desktop-Client (inoffiziell)"
license = "MIT AND OFL-1.1 AND CC-BY-4.0"
url = "https://github.com/Xinzoooo/wa-snap"
assets = [
  { source = "target/release/wa-snap", dest = "/usr/bin/wa-snap", mode = "755" },
  { source = "assets/wa-snap-system.desktop", dest = "/usr/share/applications/wa-snap.desktop", mode = "644" },
  { source = "assets/wa-snap.svg", dest = "/usr/share/icons/hicolor/scalable/apps/wa-snap.svg", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/wa-snap/LICENSE", mode = "644", doc = true },
  { source = "assets/fonts/OFL.txt", dest = "/usr/share/licenses/wa-snap/Inter-OFL.txt", mode = "644", doc = true },
  { source = "assets/TWEMOJI-LICENSE.txt", dest = "/usr/share/licenses/wa-snap/Twemoji-CC-BY-4.0.txt", mode = "644", doc = true },
]

[patch.crates-io]
# Strg+V mit Bild in der Zwischenablage durchreichen (siehe vendor/egui-winit/src/lib.rs, "wa-snap:")
egui-winit = { path = "vendor/egui-winit" }
